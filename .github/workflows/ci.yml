name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Backend tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Run backend tests
        run: |
          pip install -r requirements-dev.txt
          cd backend && python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  docker:
    name: Docker image builds and serves the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t wind-portal .

      - name: Run container and smoke-test it
        run: |
          docker run -d --name portal -p 8000:8000 wind-portal
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health >/dev/null && break
            sleep 2
          done
          echo "--- health";  curl -fsS http://localhost:8000/api/health | tee /dev/stderr | grep -q '"status":"healthy"'
          echo "--- UI";      curl -fsS http://localhost:8000/ | grep -q 'id="root"'
          echo "--- metrics"; curl -fsS http://localhost:8000/api/metrics/summary | tee /dev/stderr | grep -q '"maeMW":2041.96'
          echo "--- brief";   curl -fsS "http://localhost:8000/api/decision-brief?delivery_date=2026-01-15" | grep -q '"decisionTimestamp":"2026-01-14T09:00:00Z"'
          echo "--- validation"; test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8000/api/decision-brief?delivery_date=2026-03-01')" = "422"
          echo "All smoke tests passed"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs portal
